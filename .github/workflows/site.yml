name: site

# Every PR and push: render the reference pages from straum at the pin
# (scripts/contracts.mjs), build, check links, fail if the committed pages
# differ from the rendered ones. A push to main also deploys to GitHub Pages (ECO-D-13).
# While the repository holds no src/, the build steps are skipped, nothing
# is deployed, and GitHub Pages keeps serving its last deployment. The
# content is under the tag archive/main-2026-10-23.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.src.outputs.site }}
    steps:
      - uses: actions/checkout@v7
      - id: src
        run: if [ -d src ]; then echo site=true; else echo site=false; fi >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        if: steps.src.outputs.site == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.src.outputs.site == 'true'
      - run: npm run check
        if: steps.src.outputs.site == 'true'
      - name: The committed reference pages match the ones generated at the pin
        if: steps.src.outputs.site == 'true'
        run: git diff --exit-code -- src/content/docs && test -z "$(git status --porcelain -- src/content/docs)"
      # Non-blocking (ECO-D-23): names the reference sources that differ on
      # straum main; the pin moves only in a site PR (ECO-D-14 A).
      - name: Warn when straum main is ahead of the pin
        if: steps.src.outputs.site == 'true'
        continue-on-error: true
        run: node scripts/contracts.mjs --ahead
      - uses: actions/upload-pages-artifact@v5
        if: steps.src.outputs.site == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: needs.build.outputs.site == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
