name: core-drift

# Daily: has straum main moved past the pin in a reference source? If so, one
# open Issue labelled core-drift names the sources; it is closed once none
# differs (ECO-D-16 A, ECO-D-28 A). The site itself is not changed here.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: scripts/core-drift.sh
